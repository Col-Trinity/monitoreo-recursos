name: CI - Lint, TypeCheck, Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SKIP_ENV_VALIDATION: "1"
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      REDIS_URL: "redis://localhost:6379"
    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: monitor_user
          POSTGRES_PASSWORD: monitor_password
          POSTGRES_DB: monitoreo_recursos
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U monitor_user -d monitoreo_recursos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install Node.js dependencies
        run: pnpm install

      - name: Install Task
        run: |
          curl -sL https://github.com/go-task/task/releases/download/v3.37.2/task_linux_amd64.tar.gz | tar xz -C /tmp && sudo mv /tmp/task /usr/local/bin/

      - uses: actions/setup-go@v4
        with:
          go-version: "1.24"

      - uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install Go tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Download Go modules
        run: go work sync

      - name: Check Go formatting
        run: task format:go:check

      - name: Lint (Node.js)
        run: task lint

      - name: TypeCheck
        run: task typecheck

      - name: Build
        run: task build

      - name: Test (Unit)
        run: task test

      - name: Test (Integration - web RBAC)
        run: pnpm --filter @watchdog/web test:integration

      - name: Build agent Docker image
        run: docker build -t watchdog-agent:test ./apps/agent

      - name: Test (Integration - metrics pipeline)
        run: pnpm --filter @watchdog/api test:e2e
        timeout-minutes: 5
