services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    restart: unless-stopped
    container_name: watchdog-postgres
    environment:
      POSTGRES_USER: monitor_user
      POSTGRES_PASSWORD: monitor_password
      POSTGRES_DB: monitoreo_recursos
    command:
      - "postgres"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "max_wal_senders=5"
      - "-c"
      - "max_replication_slots=5"
      - "-c"
      - "hot_standby=on"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres/init-replica.sh:/docker-entrypoint-initdb.d/init-replica.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor_user -d monitoreo_recursos"]
      interval: 2s
      timeout: 5s
      retries: 10

  postgres-replica:
    image: timescale/timescaledb-ha:pg16
    container_name: watchdog-postgres-replica
    user: root
    entrypoint: ["/scripts/replica-entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGUSER: replicator
      PGPASSWORD: replicator_password
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5434:5432"
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./scripts/postgres/replica-entrypoint.sh:/scripts/replica-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor_user -d monitoreo_recursos"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    container_name: watchdog-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  unleash-db:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: watchdog-unleash-db
    environment:
      POSTGRES_USER: unleash_user
      POSTGRES_PASSWORD: unleash_password
      POSTGRES_DB: unleash
    volumes:
      - unleash_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unleash_user -d unleash"]
      interval: 2s
      timeout: 5s
      retries: 10
      
  unleash:
    image: unleashorg/unleash-server:6
    restart: unless-stopped
    container_name: watchdog-unleash
    depends_on:
      unleash-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://unleash_user:unleash_password@unleash-db:5432/unleash
      DATABASE_SSL: "false"
    ports:
      - "4242:4242"

volumes:
  postgres_data:
  postgres_replica_data:
  redis_data:
  unleash_db_data:
